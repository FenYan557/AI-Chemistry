# =============================================================================
# 约束表 v1.1 —— 三档处置：reject（拒收）/ downgrade（降级为定性）/ warn（保留但标记）
# =============================================================================
# 设计原则（沿用 03_数据清洗方案）：
#   · 不确定的一律降级，不猜、不补、不算
#   · 能机器判定的写 check 键，落地处三选一：
#       断言层  scripts/validate.py        （单条断言能判的）
#       图层    scripts/validate_graph.py  （需要节点/跨记录才能判的：可比性、聚合、解释链）
#       待实现  脚本里的 PENDING_CHECKS     （需人工或跨 Run 聚合，明确列出，不假装跑过）
#   · 每条规则给 rationale 与出处，答辩/论文可直接引用
# 用法：两个校验器分别跑，输出 {reject: n, downgrade: n, warn: n}
# =============================================================================
meta:
  version: v1.1
  updated: 2026-10-19
  rule_count: 51
  severity_order: [reject, downgrade, warn]

rules:

  # ── A. 锚点与溯源（硬门禁：锚定率必须 100%）──────────────────────────────
  - id: C-ANCHOR-01
    name: anchor_required
    check: anchor_required
    scope: [Observation, Claim, AdditiveUsage, Run]
    severity: reject
    rule: "每条 Observation/Claim/AdditiveUsage/Run 至少 1 个 anchor，且含 doc_id+page"
    rationale: "02_准确率 §4 的硬门禁；没有锚点就无法回原页核对，也无法在答辩时高亮原文"
  - id: C-ANCHOR-02
    name: quote_must_match_block
    check: quote_must_match_block
    scope: [anchor]
    severity: reject
    rule: "kind=block 的 quote 归一化后必须是该 block.text 的子串（或相似度 ≥0.90）"
    rationale: "LLM 复述式引用是幻觉的主要形态；子串匹配是最便宜有效的过滤器"
  - id: C-ANCHOR-03
    name: block_id_exists
    check: block_id_exists
    scope: [anchor]
    severity: reject
    rule: "block_id 必须能在清洗产物中查到"
    rationale: "block_id 由 bbox+page+type 位置哈希生成（见 id_conventions.md），不存在即链路断了"
  - id: C-ANCHOR-04
    name: numeric_from_table_cell
    check: numeric_from_table_cell
    scope: [Observation]
    severity: warn
    rule: "数值型 Observation 若来自表格，anchor 必须是 table_cell（row/col），不得只锚整表"
    rationale: "锚整表等于放弃单元格级溯源，数值错行时查不出来（01_方案最易翻车点之一）"

  # ── B. 表格与 ETL ────────────────────────────────────────────────────────
  - id: C-TABLE-01
    name: profile_required_for_numeric
    check: profile_required_for_numeric
    scope: [Table]
    severity: reject
    rule: |
      etl_profile=unknown 的表不得产出数值型 Observation。落地方式（画像字段在物化层，断言层用清洗侧 class 代理）：
      · class ∈ {descriptive, spectra, formula, method_eval, pretreat} → reject（这些表不承载工艺数值）；
      · class = data_unnamed（画像未定）→ warn，人工确认 etl_profile 前不放行；
      · 无任何画像线索 → warn。
      追加一条（图层）：unreadable 表禁数值，见 C-TABLE-04。
    rationale: "52/98 张表在清洗侧是 data_unnamed，语义未定时 ETL 会错行；先用 class 代理拦截已知非数值表，未定画像的给警告而不是直接放行"
  - id: C-TABLE-02
    name: cell_numeric_parsable
    check: cell_numeric_parsable
    scope: [Observation]
    severity: reject
    rule: |
      table_cell 引用的单元格必须能解析成数值。落地：数值型断言锚到表格单元格时，
      读该 CSV 的 (row,col)，允许 ± / ~ / 范围前缀，不接受 "N/A"、"–"、"see text" 等；
      报错须给出 table_id 与行列。列头带单位的强校验依赖 header_paths，随物化层实现。
    rationale: "TC-12 数值格与单位格分离后，列名是唯一单位来源；先保证'取到的是数字'，再要求'数字带对单位'"
  - id: C-TABLE-03
    name: anova_no_process_claim
    check: anova_no_process_claim
    scope: [Table, Claim]
    severity: reject
    rule: "etl_profile=anova 的表只能产 meta 类断言（统计支撑），不得产工艺/填充断言"
    rationale: "ANOVA 给的是显著性，不是工艺值；混用会把'显著'写成'有效'"

  # ── B2. 表格来源可信度（OCR 链路）───────────────────────────────────────
  - id: C-TABLE-04
    name: unreadable_table_no_numeric
    check: unreadable_table_no_numeric
    scope: [Table, Claim]
    severity: reject
    rule: "ocr_status=unreadable 的表不得产数值型断言；只能登记存在性（该表里的数只能人工核）"
    rationale: "3 张表 OCR 判为不可读；从不可读位图里抽数值等于编数"
  - id: C-TABLE-05
    name: partial_ocr_tier_cap
    check: partial_ocr_tier_cap
    scope: [Table, Claim]
    severity: downgrade
    rule: "ocr_status=partial 或 evidence=raster_or_image 的表，其数值断言证据等级最高 T2"
    rationale: "9 张 partial、4 张位图；OCR 出来的数与文本层数字不该同级对待，否则溯源到原页也对不出字符"
  - id: C-TABLE-06
    name: table_dim_alignment
    check: table_dim_alignment
    scope: [Table, Block]
    severity: reject
    rule: "Table.n_rows/n_cols 必须与 CSV 实际行列数、与 Block.table_meta 一致（表头两行计入行数）"
    rationale: "三者不一致说明矩阵化阶段已经把行错开；这是'条件与结果串行'最早的预警信号"
  - id: C-ANCHOR-05
    name: table_block_csv_link
    check: table_block_csv_link
    scope: [Table, Block]
    severity: reject
    rule: "每个 Table 必须能由某个 Block(block_type=table).table_meta.csv 反查，且 table_id 与 CSV 文件名序号一致"
    rationale: "表块直挂 csv 字段；不核对就会退化成按页码猜表，撞上同页多表就错位"

  # ── C. 化学与体系相容（I2 校验层）────────────────────────────────────────
  - id: C-CHEM-01
    name: no_guessed_structure
    check: no_guessed_structure
    scope: [Chemical]
    severity: reject
    rule: "smiles/inchi_key 非空时，resolution_source 必须 ∈ {pubchem, cas_common_chemistry, author_given}"
    rationale: "KG构建建议 §4：LLM 凭名称猜 SMILES 会让预测模型输出看起来合理的错数且事后查不出"
  - id: C-CHEM-02
    name: acid_base_compatible
    check: acid_base_compatible
    scope: [Claim, AdditiveUsage]
    severity: warn
    rule: "只在酸性体系被报道过的添加剂，出现在碱性 Bath 的断言必须标 cross_system_transfer=true"
    rationale: "I2 的'化学上荒谬但类型合法'典型错误"
  - id: C-CHEM-03
    name: metal_consistency
    check: metal_consistency
    scope: [Claim]
    severity: downgrade
    rule: "claim_kind=analogy 或 metal_transfer 时，subject 证据来自 Cu 而推断目标为 Co（或反向）→ 不得给 T1"
    rationale: "语料里没有任何一篇做 Cu/Co 对照，跨金属外推只能算类比证据"
  - id: C-CHEM-04
    name: acid_copper_composition
    check: acid_copper_composition
    scope: [Bath]
    severity: warn
    rule: "bath_class=acid_sulfate_cu 但成分缺 CuSO4·5H2O / H2SO4 / Cl- 之一 → 标 incomplete_bath"
    rationale: "KG构建建议 约束表第 4 条"
  - id: C-CHEM-05
    name: component_not_candidate
    check: component_not_candidate
    scope: [AdditiveUsage]
    severity: reject
    rule: "is_component=true（主盐/酸/络合剂/缓冲剂）的物种不得作为选型候选返回，不得带 role"
    rationale: "选型问的是添加剂；把 CuSO4 当抑制剂是典型错抽"

  # ── D. 单位与量纲 ────────────────────────────────────────────────────────
  - id: C-UNIT-01
    name: numeric_requires_unit
    check: numeric_requires_unit
    scope: [Observation, Claim]
    severity: reject
    rule: "数值/区间型 quantity 必须带 unit，且 unit ∈ lexicon/units_params.yaml#units"
    rationale: "数值无单位即废数据；KG构建建议 §5"
  - id: C-UNIT-02
    name: no_inexact_conversion
    check: no_inexact_conversion
    scope: [quantity]
    severity: downgrade
    rule: "涉及 ppm↔mg/L、wt%↔mg/L、mass↔molar 的换算，必须 converted=true 且 note 记前提；缺前提则降级"
    rationale: "清洗阶段禁止 LLM 换算；规则层只做量纲内精确换算"
  - id: C-UNIT-03
    name: current_density_needs_waveform
    check: current_density_needs_waveform
    scope: [Run]
    severity: warn
    rule: "有 current_density 的 Run 必须声明 waveform（DC/PPR/PR…）"
    rationale: "波形是这批文献最常漏的条件（KG构建建议 E6）；漏了窗口求交会失真"
  - id: C-UNIT-04
    name: concentration_basis_consistency
    check: concentration_basis_consistency
    scope: [window, AdditiveUsage]
    severity: reject
    rule: "同一窗口内的浓度必须同 basis（mass / molar），跨 basis 不得求交"
    rationale: "ppm/mg/L/mol·L⁻¹ 混比较是 I1 窗口求交最容易出错的地方"
  - id: C-PARAM-01
    name: param_registered
    check: param_registered
    scope: [param_value]
    severity: reject
    rule: "param 必须 ∈ lexicon/units_params.yaml#params；同一窗口内 param=concentration 出现多次时 of 必填"
    rationale: "未登记参数会让窗口求交拿着两把不同尺子比大小；of 缺失则分不清是谁的浓度"

  # ── E. 指标语义与跨族推理 ────────────────────────────────────────────────
  - id: C-IND-01
    name: potential_needs_ref_electrode
    check: potential_needs_ref_electrode
    scope: [Observation, Claim]
    severity: downgrade
    rule: "indicator ∈ {delta_eta, potential_shift, e_corr} 且缺 reference_electrode → 降级 T2 定性"
    rationale: "01_方案实测：Δη 脱离参比电极归并是最易翻车点；02_方案：数值三要素不全才降级，不能直接丢"
  - id: C-IND-02
    name: filling_ratio_needs_feature
    check: filling_ratio_needs_feature
    scope: [Claim, Observation]
    severity: downgrade
    rule: "filling_ratio / void_seam 类断言缺 Feature（孔型+AR 或孔径）或测量方法 → 降级"
    rationale: "KG构建建议 约束表第 5 条：整平类断言必须伴随基体结构"
  - id: C-IND-03
    name: tp_needs_definition
    check: tp_needs_definition
    scope: [Claim]
    severity: downgrade
    rule: "TP 断言必须绑定定义式 eq_id"
    rationale: "TP=2(T5+T6)/(T1+T2+T3+T4)×100%，没有定义式就无法解释表里的 TP 值"
  - id: C-IND-04
    name: no_cross_family_reasoning
    check: no_cross_family_reasoning
    scope: [Claim]
    severity: reject
    rule: "把 film_performance / method_derived / composition_structure 的观测当作 filling_behavior 结论的证据 → 拒收"
    rationale: "03_数据清洗方案 §九：把'硬度提升'当'整平能力提升'是这类语料最容易犯的实质错误"
  - id: C-IND-05
    name: ambiguous_symbol_resolved
    check: ambiguous_symbol_resolved
    scope: [Observation, Claim]
    severity: downgrade
    rule: "出现 ΔE / Δη / dE / η 时必须有 unit 与 indicator 归属；无法按 pitfalls.yaml 判定 → 降级待人工"
    rationale: "01_方案 §五三个真实误判"

  # ── F. 证据分级 ──────────────────────────────────────────────────────────
  - id: C-EV-01
    name: tier1_requirements
    check: tier1_requirements
    scope: [Claim, EvidenceLink]
    severity: downgrade
    rule: |
      T1 分两支，按 claim 是否携带数值判定：
      · 数值支（observation_report / composition_window / window_regime）：数值+单位、条件参数数 ≥2、
        锚点为 block 或 table_cell、quote_verdict=supported。
        条件参数 = window 里的 reported 参数 ∪ condition_source.inherited（从 Run 继承的工况）。
        **数据依据**：48 篇里表格表头只有 19/98 带浓度列、2/98 带温度列、2/98 带电流密度列，
        若只数 claim 自己的 window，几乎所有表格数值断言都会被误降级。
      · 明确措辞支（role_assignment / mechanism / composition / structure_property）：原文有作者显式措辞 + 锚点 + quote_verdict=supported，可给 T1。
      两支都不满足 → 降级 T2。
    rationale: "02_方案：validator 拦不住漏抽；tier 定义按 I6 的'有窗口有页码'落地，并按'有没有数'分两支；条件数按 own∪inherited 计，否则表格通道全灭"
  - id: C-EV-06
    name: inherited_requires_run
    check: inherited_requires_run
    scope: [Claim]
    severity: reject
    rule: "condition_source.inherited 非空 ⇒ run_ref 必填，且该 Run 的 conditions 里必须真有这些参数且 presence=reported（图层校验）"
    rationale: "继承是 tier 判定的分母来源；没有 run_ref 的'继承'等于凭空补条件，是最隐蔽的一类幻觉"
  - id: C-EV-02
    name: tier2_no_numeric
    check: tier2_no_numeric
    scope: [Claim]
    severity: downgrade
    rule: "T2 断言的 object 不得携带数值（有数值+单位就该走 T1 判定，或标条件未报道）"
    rationale: "禁止'定性结论挂数值'，否则后续统计会把定性当定量"
  - id: C-EV-03
    name: conflict_has_report
    check: conflict_has_report
    scope: [Conflict]
    severity: reject
    rule: "Conflict 必须给 report（哪个条件不同/哪个方法不同），resolution≠none 时更要写明"
    rationale: "I6 要的是显式裁决，不是'平摊平均值'"
  - id: C-EV-04
    name: confidence_not_tier
    check: confidence_not_tier
    scope: [Claim]
    severity: warn
    rule: "模型自评 confidence 不得用于抬高 evidence_tier"
    rationale: "LLM 自评分与真实正确率相关性弱；tier 只由证据形态决定"
  - id: C-EV-05
    name: no_anchor_no_claim
    check: anchor_required
    scope: [Claim]
    severity: reject
    rule: "无锚点断言 = 0 是硬门禁（与 C-ANCHOR-01 同源，按 claim 粒度再查一次）"
    rationale: "02_方案 §4 断言锚定率 100%"

  # ── G. 角色与事件结构 ────────────────────────────────────────────────────
  - id: C-ROLE-01
    name: role_on_run_not_chemical
    check: role_on_run_not_chemical
    scope: [AdditiveUsage, Chemical]
    severity: reject
    rule: "role 只能出现在 AdditiveUsage（挂在 Run 上）；Chemical 上只能有 author_charges（原文措辞）"
    rationale: "同一分子在酸铜是抑制剂、在钴体系可能是加速剂（KG构建建议 约束表第 1 条）"
  - id: C-ROLE-02
    name: unknown_role_consistency
    check: unknown_role_consistency
    scope: [AdditiveUsage]
    severity: reject
    rule: "role_source=unknown → role 必须是 unknown"
    rationale: "防止'原文没说但模型觉得像抑制剂'"
  - id: C-EXP-01
    name: run_has_conditions
    check: run_has_conditions
    scope: [Run]
    severity: reject
    rule: "Run 至少 1 个 reported 的 param_value，否则不得建 Run"
    rationale: "空条件事件无法参与窗口求交，是图里的噪声"
  - id: C-EXP-02
    name: swept_consistency
    check: swept_consistency
    scope: [Experiment, Run]
    severity: warn
    rule: "Experiment.swept_params 中的参数，其所属 Run 之间至少出现 2 个不同取值"
    rationale: "声明扫了轴但各 Run 取值相同，说明 ETL 把列读错了（数值错行的早期信号）"

  # ── H. 窗口语义（I1）────────────────────────────────────────────────────
  - id: C-WIN-01
    name: window_bounds_valid
    check: window_bounds_valid
    scope: [quantity, window]
    severity: reject
    rule: "kind=range 时 lo<=hi；open_low/open_high 只在原文用 <,>,以上/以下 时置 true"
    rationale: "区间反了会让求交静默返回空，误报'文献未涵盖'"
  - id: C-WIN-02
    name: not_reported_not_satisfied
    check: not_reported_not_satisfied
    scope: [window, retrieval]
    severity: reject
    rule: "presence=not_reported 的参数在检索评分中计为 UNKNOWN，不得计入满足；只有 unconstrained 算恒满足"
    rationale: "把缺失当开区间会让未知被当成支持，是给出假文献支持的直接原因"
  - id: C-WIN-03
    name: window_units_normalized
    check: window_units_normalized
    scope: [window]
    severity: reject
    rule: "同一 param 在窗口内的 unit 必须是 canonical（换算后再比较）"
    rationale: "mA/cm2 与 A/dm2 直接比大小会差 10 倍"

  # ── I. 结构与溯源元数据 ──────────────────────────────────────────────────
  - id: C-META-01
    name: extractor_provenance
    check: extractor_provenance
    scope: [Claim]
    severity: reject
    rule: "claim.extractor 必含 {model, prompt_ver, date}"
    rationale: "换 prompt 后必须能重跑与对比；这是可复现的最低要求"
  - id: C-META-02
    name: enum_membership
    check: enum_membership
    scope: [all]
    severity: reject
    rule: "所有枚举字段取值必须来自 lexicon"
    rationale: "封闭候选集是抑制同义爆炸的主要手段（02_方案 §1③）"
  - id: C-META-03
    name: doc_id_in_manifest
    check: doc_id_in_manifest
    scope: [all]
    severity: reject
    rule: "doc_id 必须 ∈ 文献清单 48 条"
    rationale: "防止把付费墙文献/无关文献混入"

  # ── J. 谓词注册 ─────────────────────────────────────────────────────────
  - id: C-PRED-01
    name: predicate_registered
    check: predicate_registered
    scope: [Claim]
    severity: warn
    rule: "claim.predicate 必须 ∈ schema.yaml#predicates；未登记 → review=pending 进待审区，不得入图"
    rationale: "开放谓词会立刻漂出同义/逆向/粒度三种变体，摧毁 Cypher 与窗口求交的一致性"
  - id: C-PRED-02
    name: predicate_slot_match
    check: predicate_slot_match
    scope: [Claim]
    severity: reject
    rule: "subject/object 类型必须匹配签名；window 要求为 required 而缺失 → 拒收；forbidden 却带 window → 拒收"
    rationale: "签名是谓词注册表存在的唯一意义；不校验签名等于退回开放三元组"

  # ── K. 可比性：选型排序与化学问答的正确性前提 ──────────────────────────
  - id: C-CMP-01
    name: comparability_required
    check: comparability_required
    scope: [Observation, Claim, Conflict, KnowledgeUnit]
    severity: reject
    rule: "比较大小、排序候选、检出冲突、聚合 KU，comparability_key 相同只是初筛必要条件，关键口径缺失仍为 UNKNOWN，不得据此直接比较或认定冲突；跨 key 一律输出'测量口径不同，不可直接比较'"
    rationale: "Δη 在 2 ASD/DC/盲孔 AR=3/SCE 与 1 ASD/PPR/通孔 AR=8/AgAgCl 下不是同一把尺子；混排会得出化学上无意义的'谁更强'"
  - id: C-CMP-02
    name: conflict_same_indicator_key
    check: conflict_same_indicator_key
    scope: [Conflict]
    severity: reject
    rule: "Conflict 内各 claim 必须同 indicator 且同 comparability_key；若差异确由测量口径造成，conflict_type 必须是 measurement_mismatch 且 resolution=measurement_explains"
    rationale: "否则会把'不同方法测不同东西'误报成'文献互相矛盾'，I6 的冲突检出率被噪声淹没"
  - id: C-CMP-03
    name: no_weighted_score_uncalibrated
    check: no_weighted_score_uncalibrated
    scope: [retrieval]
    severity: warn
    rule: "v0 排序只允许偏序（tier > support_class > n_docs > year；未裁决 conflicting 单独展示，不优先于无冲突证据）；禁止自造加权分数，要用数值分必须先标定并登记权重来源"
    rationale: "无标定的权重让排序看起来科学、实则不可解释；答辩一问'权重怎么定'就露"

  # ── L. 聚合层：多篇证据能不能合成一句话 ────────────────────────────────
  - id: C-KU-01
    name: ku_consensus_threshold
    check: ku_consensus_threshold
    scope: [KnowledgeUnit]
    severity: reject
    rule: "support_class=consensus 必须满足 n_docs>=2 或 n_independent_runs>=3；否则必须标 single_source"
    rationale: "KG构建建议 §3：语料里同一添加剂被多篇研究的不足 10 种；不设阈值就是把单篇结论包装成共识"
  - id: C-KU-02
    name: ku_window_reported_only
    check: ku_window_reported_only
    scope: [KnowledgeUnit]
    severity: reject
    rule: "evidence_windows 逐条保留原证据窗口；effective_window 仅表示共同支持区间，空交集记 null，不删除各自有效窗口、不跨缺口插值；只能由 presence=reported 且已归一到 canonical 单位的参数聚成；全库都没报道的必需参数写进 missing_params"
    rationale: "聚合期把缺失当开区间，等于用未知撑大窗口，用户会以为文献支持了它没支持的工况"
  - id: C-KU-03
    name: ku_tier_not_inflated
    check: ku_tier_not_inflated
    scope: [KnowledgeUnit]
    severity: reject
    rule: "KU.tier = max(evidence_claims.tier)，不得高于最强的那条单篇证据"
    rationale: "聚合常见错误是'多篇 T2 相加变 T1'；证据等级不能靠数量累加"

  # ── M. 解释链 ───────────────────────────────────────────────────────────
  - id: C-EXPLAIN-01
    name: explains_requires_scope
    check: explains_requires_scope
    scope: [Mechanism, Claim, Observation]
    severity: warn
    rule: "EXPLAINS 边必须带 window 或显式 unconstrained，strength 只取 strong/partial/speculative"
    rationale: "机理在什么条件下成立比机理本身更关键；不带条件的解释链等于可任意套用"
